name: Build Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: beerpiss/theos-action@v1
      - name: Build Dylib
        run: make
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: FolderPickerHook
          path: .theos/obj/debug/FolderPickerHook.dylib
