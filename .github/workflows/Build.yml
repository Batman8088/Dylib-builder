name: Build Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.6

      - name: Build Dylib
        run: make clean package

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: FolderPickerHook
          path: .theos/obj/debug/FolderPickerHook.dylib
