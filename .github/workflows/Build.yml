name: Build Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Dylib
         run: make

      - name: Upload Dylib
        uses: actions/upload-artifact@v5
        with:
        name: FolderPickerHook
        path: .theos/obj/debug/FolderPickerHook.dylib

    download:
       needs: build
     runs-on: macos-latest
       steps:
      - name: Download Dylib
        uses: actions/download-artifact@v5
        with:
        name: FolderPickerFix-dylib
        path: ./downloaded-files