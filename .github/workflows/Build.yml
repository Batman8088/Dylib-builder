name: Build Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git perl clang-14 lldb-14 lld-14 libc++-14-dev libc++abi-14-dev libz-dev libxml2-dev libssl-dev curl xz-utils
          git clone --recursive https://github.com $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          mkdir -p $HOME/theos/toolchain $HOME/theos/sdks
          curl -sSL https://github.com | tar -xJ -C $HOME/theos/toolchain/
          git clone --depth 1 https://github.com /tmp/sdks
          mv /tmp/sdks/*.sdk $HOME/theos/sdks/

      - name: Build Dylib
        run: make

      - name: Upload Dylib
        uses: actions/upload-artifact@v5
        with:
          name: FolderPickerHook
          path: .theos/obj/debug/FolderPickerHook.dylib
